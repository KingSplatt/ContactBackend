version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: contacts-db
    environment:
      POSTGRES_DB: contatc_splatt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BD.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contacts-api
    environment:
      SERVER_PORT: 8088
      DB_URL: jdbc:postgresql://db:5432/contatc_splatt
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JPA_SHOW_SQL: "true"
    ports:
      - "8088:8088"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
